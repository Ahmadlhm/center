server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 125s;
    }
    location /fonts/ { try_files $uri =404; expires 1d; }
    location /assets/ { try_files $uri =404; expires 7d; }
    location = /app.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }
    location = /.well-known/assetlinks.json { proxy_pass http://gateway:8080; }
    location = /.well-known/apple-app-site-association { proxy_pass http://gateway:8080; }
    location ^~ /.well-known/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
